name: Release

# Every push to main runs python-semantic-release. It reads the Conventional
# Commits since the last tag and, if any warrant a release (fix/feat/breaking),
# bumps the version, updates CHANGELOG.md, commits, tags vX.Y.Z and creates a
# GitHub Release. That version is then published:
#   PyPI -> Docker Hub + GHCR -> official MCP Registry
# The registry verifies the packages exist, so it is published last.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -e . pytest
          pytest -q

  release:
    name: Version and tag
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit, tag and GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Make sure we release from the tip of main, not a commit that has
      # since been superseded.
      - name: Sync to latest main
        run: git reset --hard origin/${{ github.ref_name }}

      - id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check versions match the tag
        run: python scripts/sync_version.py --check ${{ needs.release.outputs.tag }}

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  docker:
    name: Publish to Docker Hub and GHCR
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/muthanii/frappe-mcp:${{ needs.release.outputs.version }}
            docker.io/muthanii/frappe-mcp:latest
            ghcr.io/muthanii/frappe-mcp:${{ needs.release.outputs.version }}
            ghcr.io/muthanii/frappe-mcp:latest

  mcp-registry:
    name: Publish to MCP Registry
    needs: [release, pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
